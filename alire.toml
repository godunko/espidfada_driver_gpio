name = "espidfada_driver_gpio"
version = "0.1.0"
website = "https://github.com/godunko/espidfada_driver_gpio"
description = "ESP-IDF/Ada: GPIO driver bindings"
long-description = """
Ada bindings for the ESP-IDF general-purpose input/output (GPIO) driver
(`esp_driver_gpio`).

Provides pin configuration, digital input and output, and GPIO interrupt handling.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf", "gpio"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidfada = "^0.3.0"
